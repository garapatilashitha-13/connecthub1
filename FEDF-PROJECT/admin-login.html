<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ConnectHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card admin-card">

            <div class="admin-icon">🔐</div>

            <h2>Admin Login</h2>

            <p class="subtitle">ConnectHub Administration</p>

            <input type="text"
                   id="adminUsername"
                   placeholder="Admin Username">

            <input type="password"
                   id="adminPassword"
                   placeholder="Admin Password">

            <button type="button"
                    class="btn admin-btn full-btn"
                    onclick="adminLogin()">
                Admin Login
            </button>

            <p class="admin-hint">
                Demo: jaya / jaya@123
            </p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
